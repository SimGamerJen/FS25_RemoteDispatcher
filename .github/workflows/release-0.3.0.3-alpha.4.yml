name: Release Remote Dispatcher 0.3.0.3-alpha.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.0.3-alpha.4.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate alpha.4 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          mod_path = root / 'modDesc.xml'
          mod = ET.parse(mod_path).getroot()

          if mod.findtext('version') != '0.3.0.3':
              raise SystemExit(f"Unexpected mod version: {mod.findtext('version')}")

          l10n_elem = mod.find('./l10n')
          if l10n_elem is None:
              raise SystemExit('modDesc.xml has no l10n declaration')
          prefix = l10n_elem.attrib.get('filenamePrefix')
          language = l10n_elem.attrib.get('defaultLanguage')
          if not prefix or not language:
              raise SystemExit('l10n filenamePrefix/defaultLanguage is incomplete')
          l10n_path = root / f'{prefix}{language}.xml'
          if not l10n_path.is_file():
              raise SystemExit(
                  f'GIANTS-resolved localisation file is missing: {l10n_path} '
                  f'(prefix={prefix!r}, defaultLanguage={language!r})'
              )

          for path in [
              mod_path,
              root / 'gui' / 'RemoteDispatcherScreen.xml',
              root / 'gui' / 'guiProfiles.xml',
              l10n_path,
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')

          missing = []
          for elem in mod.findall('./extraSourceFiles/sourceFile'):
              filename = elem.attrib.get('filename')
              if filename and not (root / filename).is_file():
                  missing.append(filename)
          if missing:
              raise SystemExit(f'Missing sourceFile entries: {missing}')

          action_names = {
              action.attrib.get('name')
              for action in mod.findall('./actions/action')
              if action.attrib.get('name')
          }
          l10n = ET.parse(l10n_path).getroot()
          l10n_names = {
              text.attrib.get('name')
              for text in l10n.findall('./texts/text')
              if text.attrib.get('name')
          }
          missing_action_l10n = sorted(
              f'input_{name}' for name in action_names
              if f'input_{name}' not in l10n_names
          )
          if missing_action_l10n:
              raise SystemExit(f'Missing input action localisation: {missing_action_l10n}')

          source_files = [e.attrib.get('filename') for e in mod.findall('./extraSourceFiles/sourceFile')]
          for required_source in [
              'scripts/RemoteDispatcherVehicleInput.lua',
              'scripts/RemoteDispatcherActivationFix.lua',
              'scripts/RemoteDispatcherDiagnostics.lua',
          ]:
              if required_source not in source_files:
                  raise SystemExit(f'Required source layer is missing from modDesc.xml: {required_source}')

          activation = (root / 'scripts/RemoteDispatcherActivationFix.lua').read_text(encoding='utf-8')
          if 'AD_OBSERVATION_CHECKPOINTS_MS = {250, 500, 1000}' not in activation:
              raise SystemExit('AutoDrive post-start observation checkpoints are missing')

          notes = (root / 'docs/releases/0.3.0.3-alpha.4.md').read_text(encoding='utf-8')
          if 'HelperProfiles 2.1.1.0' not in notes:
              raise SystemExit('Release notes do not declare HelperProfiles 2.1.1.0')
          if 'observational only' not in notes.lower():
              raise SystemExit('Release notes do not state that post-start diagnostics are observational only')

          print(f'GIANTS localisation resolution OK: {prefix}+{language}.xml -> {l10n_path}')
          PY

      - name: Build FS25 mod ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_RemoteDispatcher.zip
          zip -r FS25_RemoteDispatcher.zip \
            modDesc.xml README.md RemoteDispatcher.dds gui scripts translations docs \
            -x '*.DS_Store' '*__MACOSX*' '.git*'

          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          package = 'FS25_RemoteDispatcher.zip'
          with zipfile.ZipFile(package, 'r') as archive:
              required = {
                  'modDesc.xml',
                  'RemoteDispatcher.dds',
                  'scripts/RemoteDispatcher.lua',
                  'scripts/RemoteDispatcherVehicleInput.lua',
                  'scripts/RemoteDispatcherHelperProfiles.lua',
                  'scripts/RemoteDispatcherActivationFix.lua',
                  'scripts/RemoteDispatcherPersistence.lua',
                  'scripts/RemoteDispatcherDiagnostics.lua',
                  'gui/RemoteDispatcherScreen.xml',
              }

              root = ET.fromstring(archive.read('modDesc.xml'))
              if root.findtext('version') != '0.3.0.3':
                  raise SystemExit('Packaged modDesc has unexpected version')

              l10n = root.find('./l10n')
              if l10n is None:
                  raise SystemExit('Packaged modDesc has no l10n declaration')
              resolved_l10n = (
                  f"{l10n.attrib.get('filenamePrefix', '')}"
                  f"{l10n.attrib.get('defaultLanguage', '')}.xml"
              )
              required.add(resolved_l10n)

              missing = sorted(required - set(archive.namelist()))
              if missing:
                  raise SystemExit(f'Missing package files: {missing}')
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              print(f'Packaged GIANTS localisation file OK: {resolved_l10n}')
          PY

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='0.3.0.3-alpha.4'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FS25_RemoteDispatcher.zip --clobber
            gh release edit "$TAG" \
              --title 'Remote Dispatcher 0.3.0.3-alpha.4' \
              --notes-file docs/releases/0.3.0.3-alpha.4.md \
              --prerelease
          else
            gh release create "$TAG" \
              FS25_RemoteDispatcher.zip \
              --target main \
              --title 'Remote Dispatcher 0.3.0.3-alpha.4' \
              --notes-file docs/releases/0.3.0.3-alpha.4.md \
              --prerelease
          fi
