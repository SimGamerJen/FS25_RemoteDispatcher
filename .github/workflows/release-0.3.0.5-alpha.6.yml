name: Release Remote Dispatcher 0.3.0.5-alpha.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.0.5-alpha.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate alpha.6 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          mod = ET.parse(root / 'modDesc.xml').getroot()

          if mod.findtext('version') != '0.3.0.5':
              raise SystemExit(f"Unexpected mod version: {mod.findtext('version')}")

          l10n = mod.find('./l10n')
          if l10n is None or l10n.attrib.get('filenamePrefix') != 'l10n/l10n':
              raise SystemExit('Unexpected l10n declaration')
          l10n_path = root / 'l10n/l10n_en.xml'
          ET.parse(l10n_path)

          vehicle_input = (root / 'scripts/RemoteDispatcherVehicleInput.lua').read_text(encoding='utf-8')
          selector = (root / 'scripts/RemoteDispatcherSelector.lua').read_text(encoding='utf-8')

          required = [
              'function(vehicle, excludedVehicle)',
              'vehicle.getIsActiveForInput',
              'pcall(vehicle.getIsActiveForInput, vehicle)',
              'vehicle:addActionEvent(',
              'vehicle:clearActionEventsTable',
              'Utils.appendedFunction',
          ]
          for marker in required:
              if marker not in vehicle_input:
                  raise SystemExit(f'Missing corrected vehicle-input marker: {marker}')

          forbidden = [
              'isActiveRootVehicle',
              'beginActionEventsModification(Vehicle.INPUT_CONTEXT_NAME)',
              'function(vehicle, isActiveForInput',
          ]
          for marker in forbidden:
              if marker in vehicle_input:
                  raise SystemExit(f'Legacy/incorrect vehicle-input path still present: {marker}')

          if 'g_inputBinding:removeActionEventsByTarget(self)' in selector:
              raise SystemExit('Selector still removes all RD action events by target')

          activation = (root / 'scripts/RemoteDispatcherActivationFix.lua').read_text(encoding='utf-8')
          if 'AD_OBSERVATION_CHECKPOINTS_MS = {250, 500, 1000}' not in activation:
              raise SystemExit('AutoDrive post-start observation checkpoints are missing')

          notes = (root / 'docs/releases/0.3.0.5-alpha.6.md').read_text(encoding='utf-8')
          for expected in ['Zetor Crystal 16045', 'Massey Ferguson 8570', 'two separate saves', 'HelperProfiles 2.1.1.0']:
              if expected not in notes:
                  raise SystemExit(f'Release notes missing validation detail: {expected}')

          print('alpha.6 release metadata OK')
          PY

      - name: Build FS25 mod ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_RemoteDispatcher.zip
          zip -r FS25_RemoteDispatcher.zip \
            modDesc.xml README.md RemoteDispatcher.dds gui scripts l10n docs \
            -x '*.DS_Store' '*__MACOSX*' '.git*'

          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          package = 'FS25_RemoteDispatcher.zip'
          with zipfile.ZipFile(package, 'r') as archive:
              required = {
                  'modDesc.xml',
                  'RemoteDispatcher.dds',
                  'scripts/RemoteDispatcher.lua',
                  'scripts/RemoteDispatcherVehicleInput.lua',
                  'scripts/RemoteDispatcherHelperProfiles.lua',
                  'scripts/RemoteDispatcherActivationFix.lua',
                  'scripts/RemoteDispatcherPersistence.lua',
                  'scripts/RemoteDispatcherDiagnostics.lua',
                  'gui/RemoteDispatcherScreen.xml',
                  'l10n/l10n_en.xml',
              }
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing package files: {missing}')

              root = ET.fromstring(archive.read('modDesc.xml'))
              if root.findtext('version') != '0.3.0.5':
                  raise SystemExit('Packaged modDesc has unexpected version')

              vehicle_input = archive.read('scripts/RemoteDispatcherVehicleInput.lua').decode('utf-8')
              if 'pcall(vehicle.getIsActiveForInput, vehicle)' not in vehicle_input:
                  raise SystemExit('Packaged vehicle input fix is missing')

              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
          PY

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='0.3.0.5-alpha.6'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FS25_RemoteDispatcher.zip --clobber
            gh release edit "$TAG" \
              --title 'Remote Dispatcher 0.3.0.5-alpha.6' \
              --notes-file docs/releases/0.3.0.5-alpha.6.md \
              --prerelease
          else
            gh release create "$TAG" \
              FS25_RemoteDispatcher.zip \
              --target main \
              --title 'Remote Dispatcher 0.3.0.5-alpha.6' \
              --notes-file docs/releases/0.3.0.5-alpha.6.md \
              --prerelease
          fi
