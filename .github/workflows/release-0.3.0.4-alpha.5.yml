name: Release Remote Dispatcher 0.3.0.4-alpha.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.3.0.4-alpha.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate alpha.5 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          mod_path = root / 'modDesc.xml'
          mod = ET.parse(mod_path).getroot()

          if mod.findtext('version') != '0.3.0.4':
              raise SystemExit(f"Unexpected mod version: {mod.findtext('version')}")

          l10n_elem = mod.find('./l10n')
          if l10n_elem is None:
              raise SystemExit('modDesc.xml has no l10n declaration')
          prefix = l10n_elem.attrib.get('filenamePrefix')
          if prefix != 'l10n/l10n':
              raise SystemExit(f"Unexpected l10n prefix: {prefix!r}")
          l10n_path = root / f'{prefix}_en.xml'
          if not l10n_path.is_file():
              raise SystemExit(f'GIANTS English localisation file is missing: {l10n_path}')

          for path in [
              mod_path,
              root / 'gui' / 'RemoteDispatcherScreen.xml',
              root / 'gui' / 'guiProfiles.xml',
              l10n_path,
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')

          missing = []
          for elem in mod.findall('./extraSourceFiles/sourceFile'):
              filename = elem.attrib.get('filename')
              if filename and not (root / filename).is_file():
                  missing.append(filename)
          if missing:
              raise SystemExit(f'Missing sourceFile entries: {missing}')

          action_names = {
              action.attrib.get('name')
              for action in mod.findall('./actions/action')
              if action.attrib.get('name')
          }
          l10n = ET.parse(l10n_path).getroot()
          l10n_names = {
              text.attrib.get('name')
              for text in l10n.findall('./texts/text')
              if text.attrib.get('name')
          }

          missing_action_l10n = sorted(
              f'input_{name}' for name in action_names
              if f'input_{name}' not in l10n_names
          )
          if missing_action_l10n:
              raise SystemExit(f'Missing input action localisation: {missing_action_l10n}')

          required_ui_l10n = {
              'rd_management_title',
              'rd_header_vehicles',
              'rd_header_workers',
              'rd_col_vehicle',
              'rd_col_auto',
              'rd_col_state',
              'rd_col_worker',
              'rd_col_task',
              'rd_col_slot',
              'rd_management_hint',
              'rd_button_close',
              'rd_button_automation',
              'rd_button_assign',
          }
          missing_ui_l10n = sorted(required_ui_l10n - l10n_names)
          if missing_ui_l10n:
              raise SystemExit(f'Missing Management UI localisation: {missing_ui_l10n}')

          if (root / 'translations' / 'l10n_en.xml').exists():
              raise SystemExit('Obsolete translations/l10n_en.xml still exists')

          activation = (root / 'scripts/RemoteDispatcherActivationFix.lua').read_text(encoding='utf-8')
          if 'AD_OBSERVATION_CHECKPOINTS_MS = {250, 500, 1000}' not in activation:
              raise SystemExit('AutoDrive post-start observation checkpoints are missing')

          notes = (root / 'docs/releases/0.3.0.4-alpha.5.md').read_text(encoding='utf-8')
          if 'HelperProfiles 2.1.1.0' not in notes:
              raise SystemExit('Release notes do not declare HelperProfiles 2.1.1.0')
          if 'smoke-tested in FS25' not in notes:
              raise SystemExit('Release notes do not record the in-game localisation smoke test')

          print(f'GIANTS localisation convention OK: {prefix} + _en.xml -> {l10n_path}')
          PY

      - name: Build FS25 mod ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_RemoteDispatcher.zip
          zip -r FS25_RemoteDispatcher.zip \
            modDesc.xml README.md RemoteDispatcher.dds gui scripts l10n docs \
            -x '*.DS_Store' '*__MACOSX*' '.git*'

          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          package = 'FS25_RemoteDispatcher.zip'
          with zipfile.ZipFile(package, 'r') as archive:
              required = {
                  'modDesc.xml',
                  'RemoteDispatcher.dds',
                  'scripts/RemoteDispatcher.lua',
                  'scripts/RemoteDispatcherVehicleInput.lua',
                  'scripts/RemoteDispatcherHelperProfiles.lua',
                  'scripts/RemoteDispatcherActivationFix.lua',
                  'scripts/RemoteDispatcherPersistence.lua',
                  'scripts/RemoteDispatcherDiagnostics.lua',
                  'gui/RemoteDispatcherScreen.xml',
                  'l10n/l10n_en.xml',
              }

              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing package files: {missing}')
              if 'translations/l10n_en.xml' in names:
                  raise SystemExit('Obsolete translations/l10n_en.xml was packaged')

              root = ET.fromstring(archive.read('modDesc.xml'))
              if root.findtext('version') != '0.3.0.4':
                  raise SystemExit('Packaged modDesc has unexpected version')
              l10n = root.find('./l10n')
              if l10n is None or l10n.attrib.get('filenamePrefix') != 'l10n/l10n':
                  raise SystemExit('Packaged modDesc has unexpected l10n prefix')

              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
          PY

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='0.3.0.4-alpha.5'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FS25_RemoteDispatcher.zip --clobber
            gh release edit "$TAG" \
              --title 'Remote Dispatcher 0.3.0.4-alpha.5' \
              --notes-file docs/releases/0.3.0.4-alpha.5.md \
              --prerelease
          else
            gh release create "$TAG" \
              FS25_RemoteDispatcher.zip \
              --target main \
              --title 'Remote Dispatcher 0.3.0.4-alpha.5' \
              --notes-file docs/releases/0.3.0.4-alpha.5.md \
              --prerelease
          fi
